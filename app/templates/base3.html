<body>

        <div class="container-fluid">
            <a href="{% url 'index' %}" class="navbar-brand" style="font-weight:bold;">Home</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menu">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a href="{% url 'notice' %}" class="nav-link" aria-current="page" style="font-weight:bold;">NOTICE</a>
                    </li>
                    <li class="nav-item">
                        <a href="{% url 'attendence' %}" class="nav-link" aria-current="page" style="font-weight:bold;">ATTENDENCE</a>
                    </li>
                
                    </ul>

                          <div class="dropdown ms-auto">
    <a href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
        <i class="bi bi-person-circle fs-3"></i>
    </a>

    <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="{% url 'changepassword' %}">Change Password</a></li>

    </ul>
</div>
    
    
                 
               
            </div>
        </div>
    </nav>
   {% if messages %}
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }} alert-dismissible fade show"
             role="alert">
            {{ message }}

            <button type="button"
                    class="btn-close"
                    data-bs-dismiss="alert"
                    aria-label="Close">
            </button>
        </div>
    {% endfor %}
{% endif %}
    {% block content %}
    {% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

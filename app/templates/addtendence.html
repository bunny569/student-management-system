{% extends "base.html" %}
{% load static %}

{% block content %}
   <form method="POST"> 
    {% csrf_token %}
    <table class="table table-bordered table-striped">
        <thead>
            <tr>
                <th>Roll Number</th>
                <th>Name</th>
                <th>Present</th>
                <th>Absent</th>
            </tr>
        </thead>

        <tbody>
            {% for student in students %}
            <tr>
                <td>{{ student.roll_number }}</td>
                <td>{{ student.name }}</td>

                <td>
                    <input type="radio"
                           name="attendance_{{ student.id }}"
                           value="Present">
                </td>

                <td>
                    <input type="radio"
                           name="attendance_{{ student.id }}"
                           value="Absent">
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <button type="submit" class="btn btn-primary">Submit</button>

</form>

{% endblock %}

{% extends 'base.html' %}
{% load static %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/style1.css' %}">

<div class="course-page">
      <div class="box2">
    <form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="ADD" class="btn btn-primary">
</form>

</div>
<table class="table">
    <thead>
        <tr>
            <th scope="col">Course</th>
            <th scope="col"> </th>
        </tr>
    </thead>
    <tbody>
        {% for course in courses %}
        
        <tr>
            <td scope="row">{{ course.course }}</td>
            <td scope="row"><a href="{% url 'deletecourse' pk=course.pk %}" class="btn btn-danger">DELETE</a></td>
        </tr>
         {% endfor %}
        
    </tbody>
   
</table>

</div>
{% endblock %}
